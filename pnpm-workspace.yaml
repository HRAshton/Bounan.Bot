packages:
  - packages/*
  - third-party/common/ts

allowBuilds:
  esbuild: true
  msw: true

blockExoticSubdeps: true

catalog:
  '@biomejs/biome': 2.5.12
  '@aws-sdk/client-dynamodb': 3.1126.0
  '@aws-sdk/client-lambda': 3.1126.0
  '@aws-sdk/client-ssm': 3.1126.0
  '@aws-sdk/lib-dynamodb': 3.1126.0
  '@lightweight-clients/jikan-api-lightweight-client': 4.0.2
  '@lightweight-clients/shikimori-graphql-api-lightweight-client': 1.2.0
  '@lightweight-clients/telegram-bot-api-lightweight-client': 10.3.0
  '@types/aws-lambda': 8.10.163
  '@types/node': 25.9.5
  '@vitest/coverage-v8': 4.1.11
  '@vitest/ui': 4.1.11
  aws-cdk: 2.1139.0
  aws-cdk-lib: 2.268.0
  cdk-lambda-llrt: 0.1.4
  constructs: 10.8.1
  cross-env: 10.1.0
  jiti: 2.7.0
  knip: 6.34.0
  npm-run-all2: 9.0.3
  typescript: 7.0.2
  vitest: 4.1.11

# Delay newly published versions for one day to reduce supply-chain risk.
minimumReleaseAge: 1440

# Use hoisted node linker for compatibility with LlrtFunction construct. This construct bundles
# dependencies using docker, which does not work with host's symlinks.
nodeLinker: hoisted

trustPolicy: no-downgrade
